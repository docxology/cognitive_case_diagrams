name: Python quality and reproducibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install the locked environment and optional MCP interface
        run: uv sync --frozen --extra mcp
      - name: Run lint, types, real method and MCP tests with coverage
        run: uv run --frozen python scripts/quality_gate.py --coverage
      - name: Build the installable software
        run: uv build --no-sources
      - name: Regenerate experiments, figures and manuscript variables
        if: matrix.python-version == '3.12'
        run: |
          uv run --frozen python scripts/run_experiments.py
          uv run --frozen python scripts/generate_diagrams.py
          uv run --frozen python scripts/inject_variables.py
          uv run --frozen python scripts/validate_project.py


  release-package:
    # Candidate-artifact verification only. Actual visual inspection stays a
    # human/lane act recorded via record_publication_review; CI never creates
    # or demands a visual-review receipt, so scripts/build_release.py (whose
    # gate requires one) is intentionally not run here.
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install the locked environment and optional MCP interface
        run: uv sync --frozen --extra mcp
      - name: Produce current source-bound evidence
        run: |
          uv run --frozen python scripts/quality_gate.py --coverage
          uv run --frozen python scripts/run_experiments.py
          uv run --frozen python scripts/generate_diagrams.py
          uv run --frozen python scripts/inject_variables.py
      - name: Reject non-volatile committed metadata drift before regeneration
        # Receipt-derived quantities embedded in the abstract (test counts,
        # coverage, timestamps) change per gate run and are excluded; any
        # non-volatile drift (version, DOIs, license, title) must fail until
        # the sidecars are deliberately regenerated.
        run: |
          uv run --frozen python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          from src.release_metadata import build_release_metadata

          expected = build_release_metadata(Path('.'))
          committed_citation = yaml.safe_load(Path('CITATION.cff').read_text(encoding='utf-8'))
          committed_software = json.loads(Path('.zenodo.json').read_text(encoding='utf-8'))
          volatile = {'abstract', 'description'}
          strip = lambda payload: {k: v for k, v in payload.items() if k not in volatile}
          assert strip(committed_citation) == strip(expected['citation']), (
              'committed CITATION.cff drifted in a non-volatile field; regenerate metadata'
          )
          assert strip(committed_software) == strip(expected['software']), (
              'committed .zenodo.json drifted in a non-volatile field; regenerate metadata'
          )
          print('non-volatile metadata fields match the canonical configuration')
          PY
      - name: Regenerate intended generated metadata (intended lifecycle, not drift hiding)
        run: |
          uv run --frozen python scripts/build_release.py --metadata-only
          uv run --frozen python scripts/validate_project.py
      - name: Automated candidate assembly (no visual-review receipt is created or demanded)
        # The tracked publication-review record binds committed-era bytes that
        # CI has just regenerated, so the candidate archive intentionally
        # omits it; verify passes without it (embedded evidence is
        # conditional). The tracked record is restored untouched afterwards.
        run: |
          review_record="output/reports/publication_review.json"
          if [ -f "$review_record" ]; then mv "$review_record" /tmp/ccd-candidate-review.json; fi
          restore() { if [ -f /tmp/ccd-candidate-review.json ]; then mv /tmp/ccd-candidate-review.json "$review_record"; fi; }
          trap restore EXIT
          uv run --frozen python - <<'PY'
          from pathlib import Path

          from src.release_bundle import build_release_archive, verify_release_archive
          from src.release_metadata import validate_release_metadata

          metadata = validate_release_metadata(Path('.'))
          version, day = metadata['version'], metadata['date']
          destination = Path('output/candidate')
          first = build_release_archive(
              Path('.'), destination / f'candidate-{version}.zip',
              version=version, publication_date=day,
          )
          second = build_release_archive(
              Path('.'), destination / f'candidate-{version}-again.zip',
              version=version, publication_date=day,
          )
          assert first['archive_sha256'] == second['archive_sha256'], (
              'candidate archive assembly is not deterministic'
          )
          assert verify_release_archive(destination / f'candidate-{version}.zip') == first
          assert not any('publication_review' in name for name in first['files']), (
              'candidate assembly must not carry a stale-bound review record'
          )
          print('verified candidate archive sha256:', first['archive_sha256'])
          PY
      - name: Install the built wheel with the MCP extra in a clean interpreter
        run: |
          uv build --no-sources
          wheel_path="$(ls dist/cognitive_case_diagrams-*.whl)"
          test "$(printf '%s\n' "$wheel_path" | wc -l)" -eq 1
          uv venv /tmp/ccd-release-smoke --python 3.12
          uv pip install --python /tmp/ccd-release-smoke/bin/python "${wheel_path}[mcp]"
          /tmp/ccd-release-smoke/bin/python -c "import mcp, src; print('wheel imports: sdk + package ok')"
          /tmp/ccd-release-smoke/bin/ccd-mcp --version
          /tmp/ccd-release-smoke/bin/ccd-mcp --list-tools
      - name: Evidence-status exit contract from the wheel
        run: |
          set +e
          report="$(/tmp/ccd-release-smoke/bin/ccd-evidence-status --project-root "$GITHUB_WORKSPACE" 2>/tmp/ccd-evidence-status.stderr)"
          status=$?
          set -e
          test ! -s /tmp/ccd-evidence-status.stderr || { cat /tmp/ccd-evidence-status.stderr >&2; echo "unexpected evidence-status stderr"; exit 1; }
          echo "$report"
          EVIDENCE_REPORT="$report" uv run --frozen python -c "import json, os; report = json.loads(os.environ['EVIDENCE_REPORT']); assert report['schema'] == 'ccd-evidence-status-v1'; assert report['overall'] == 'incomplete' and report['exit_code'] == 1; assert (report['overall'] == 'validated') == (report['exit_code'] == 0); assert set(report['evidence']) == {'quality', 'experiments', 'manuscript', 'metadata', 'visual_review', 'release'}; print('evidence-status contract ok:', report['overall'])"
      - name: SDK stdio smoke against the installed wheel in an isolated cwd
        run: |
          uv run --frozen python - <<'PY'
          import asyncio
          import json

          from mcp import Client, StdioServerParameters


          async def main() -> None:
              # cwd=/tmp keeps the server on wheel-resolved modules only: the
              # checkout's src/ tree is invisible from that working directory.
              params = StdioServerParameters(
                  command='/tmp/ccd-release-smoke/bin/ccd-mcp', cwd='/tmp'
              )
              async with Client(params) as client:
                  tools = (await client.list_tools()).tools
                  assert len(tools) >= 17, 'wheel serves fewer tools than advertised'
                  capabilities = (await client.read_resource('ccd://capabilities')).contents[0].text
                  payload = json.loads(capabilities)
                  assert payload['server'] == 'cognitive-case-diagrams'
                  receipt = payload['quality_receipt']
                  assert receipt['status'] in {'validated', 'missing', 'stale_or_invalid'}
                  print(f'wheel stdio smoke ok: {len(tools)} tools, receipt {receipt["status"]}')


          asyncio.run(main())
          PY
      - name: Upload the verified candidate archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-archive
          path: output/candidate/

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
