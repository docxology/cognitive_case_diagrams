# Cognitive Case Diagrams Configuration
# Category-theoretic approaches to linguistic case systems

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive_case_diagrams"
version = "2.3.0"
description = "Category-theoretic formalization of linguistic case systems with DisCoPy visualizations"
authors = [
    {name = "Daniel Ari Friedman", email = "danielarifriedman@gmail.com"}
]
requires-python = ">=3.10"
readme = "docs/README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "discopy>=1.0.0",
]

[project.urls]
# Must match the actual git remote (`git remote -v`), not an aspirational org.
Repository = "https://github.com/docxology/cognitive_case_diagrams"
Documentation = "https://github.com/docxology/cognitive_case_diagrams/blob/main/docs/README.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.1.0",  # required for [tool.pytest.ini_options] timeout
]
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["output/", ".venv/"]

[tool.ruff.lint]
# F: pyflakes (real defects: unused imports/variables); E402/E702/E741 are
# triaged to per-file ignores below rather than globally silenced.
select = ["F"]
ignore = [
    # __init__.py re-export chains are intentional public API surfaces.
]

[tool.ruff.lint.per-file-ignores]
# Re-export modules: unused imports are the public API.
"__init__.py" = ["F401"]
# scripts inject sys.path before imports by design (standalone fallback pattern).
"scripts/inject_variables.py" = ["E402"]
"tests/conftest.py" = ["E402"]
"tests/test_visualization_syntactic_sentence_diagrams.py" = ["E402"]
# Exercised-call sites bind figures/results without asserting on them.
"tests/test_visualization_*" = ["F841"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["output/", "scripts/"]

[[tool.mypy.overrides]]
module = ["discopy.*", "matplotlib.*", "matplotlib", "networkx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
timeout = 300
filterwarnings = [
    # DiscoPy calls plt.show() on Agg; harmless in headless runs.
    "ignore:FigureCanvasAgg is non-interactive, and thus cannot be shown:UserWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
# DisCoPy / NumPy can use threads or multiprocessing; align tracer data with branch coverage.
concurrency = ["multiprocessing", "thread"]
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]
# NOTE: diagrams/complexity_examples.py and visualization/discopy_diagrams.py were
# previously omitted here as "untestable without optional discopy install". That
# justification was false — discopy is a REQUIRED dependency of this package (see
# [project.dependencies]), and both modules are exercised by passing test files
# (tests/test_diagrams_complexity_examples.py, tests/test_visualization_discopy_diagrams.py).
# Excluding them made the headline coverage number cover less code than it claimed.

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]

[tool.uv]

[dependency-groups]
# uv syncs this group by default. The test toolchain must live here, not only in
# [project.optional-dependencies], or `uv sync && uv run pytest` silently resolves
# to whatever pytest happens to be on PATH under a different interpreter.
dev = [
    "hypothesis>=6.151.11",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.1.0",
]
