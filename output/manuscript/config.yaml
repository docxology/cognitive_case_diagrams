# Manuscript Variable Injection
# Every quantitative claim in docs/manuscript/*.md is injected through the
# typed registry in src/manuscript_variables.py; collectors live in
# src/generate_manuscript_metrics.py and scripts/inject_variables.py
# performs the ${variable_name} substitution into output/manuscript/.
#
# Provenance classes: quality_receipt (source-bound receipt, never a bare
# coverage.json), experiments (schema-1.0 synthetic runner output at
# output/experiments/results.json), computed (public src APIs
# on canonical synthetic inputs), config (this file / pyproject),
# collection (pytest --collect-only and structural counts), environment
# (installed distribution versions).
#
# The authoritative identifier list with units, formats, provenance, and
# descriptions is `variable_specs()` in src/manuscript_variables.py; the
# groups most visible in prose are:
#   total_test_count / total_tests_passed / total_tests_failed /
#     total_tests_skipped  - collection count versus passing receipt
#   coverage_percent / coverage_lines_covered / coverage_lines_total /
#     quality_fingerprint_short / quality_receipt_generated_at
#   total_test_files(_word), domain_subpackages, daif_*, total_figures
#   discopy_version(_pretty), numpy_version(_pretty)
#   paper_version, paper_date, paper_doi, paper_version_doi,
#     paper_version_record_url, paper_prior_version_doi, publication_status
#   ci_level_percent, ci_z_score
#   enriched_*, topos_*, quantum_*_probability,
#     daif_bellman_example_*, daif_projection_*,
#     daif_trajectory_evidence_count, daif_assignment_iterations,
#     standard_inventory_*, alignment_extra_label_*,
#     introductory_figure_role_count, syntactic_panel_sketch_count(_word)
#   exp_* (synthetic experiments; see 07d and the methods lane registry)
#
# To inject: python scripts/inject_variables.py
# The render pipeline auto-detects output/manuscript/ for injection.

# The manuscript is maintained as a paper and web article. Slides require
# separate design. Interval metadata (confidence level and the NormalDist
# quantile) is computed by the experiments runner from its declared
# configuration; no duplicate constants are kept in this file.


render:
  formats:
    pdf: true
    html: true
    slides: false
    docx: false
    epub: false
