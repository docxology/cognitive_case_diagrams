name: Python quality and reproducibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install the locked environment and optional MCP interface
        run: uv sync --frozen --extra mcp
      - name: Run lint, types, real method and MCP tests with coverage
        run: uv run --frozen python scripts/quality_gate.py --coverage
      - name: Build the installable software
        run: uv build --no-sources
      - name: Regenerate experiments, figures and manuscript variables
        if: matrix.python-version == '3.12'
        run: |
          uv run --frozen python scripts/run_experiments.py
          uv run --frozen python scripts/generate_diagrams.py
          uv run --frozen python scripts/inject_variables.py
          uv run --frozen python scripts/validate_project.py
