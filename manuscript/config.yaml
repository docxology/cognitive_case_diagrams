# Manuscript Variable Injection
# Variables below are auto-computed by src/generate_manuscript_metrics.py
# and injected into docs/manuscript/*.md via scripts/inject_variables.py.
# In manuscript files, use ${variable_name} syntax.
#
# Available variables:
#   ${total_test_count}     - Total pytest-collected test count
#   ${total_test_files}     - Number of test_*.py files
#   ${total_test_files_word} - English words for total_test_files (e.g. "forty-nine")
#   ${domain_subpackages}   - Count of first-level packages under src/ (domain layers)
#   ${daif_modules}         - Number of .py modules in src/daif/
#   ${daif_symbols}         - Number of public symbols in daif.__all__
#   ${daif_tests}           - Test count in test_daif*.py files
#   ${daif_test_files}      - Number of test_daif*.py files
#   ${daif_modules_word}    - English word for daif_modules (e.g. "seven")
#   ${total_figures}        - PNG count in output/figures/ (matches generate_diagrams.py)
#   ${coverage_summary}     - One-line coverage blurb from coverage.json (or instructions if missing)
#   ${coverage_percent}     - Display percent string when coverage.json exists (else empty)
#   ${coverage_lines_covered} / ${coverage_lines_total} - Optional line totals from coverage.json
#   ${discopy_version} / ${numpy_version} - Installed package versions (may be empty)
#   ${discopy_version_pretty} / ${numpy_version_pretty} - Versions safe for prose
#
# To inject: python scripts/inject_variables.py
# The render pipeline auto-detects output/manuscript/ for injection.
